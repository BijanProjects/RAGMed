[project]
name = "ragmed-coordinator-agent"
version = "0.1.0"
description = "Care Coordinator agent: safety screening, routing, and the conversation with the patient."
requires-python = ">=3.12"
dependencies = [
  "a2a-sdk[http-server]>=1.3,<2",
  "langchain-core>=1.8,<2",
  "langchain-groq>=1.2,<2",
  "langgraph>=1.2,<2",
  "ragmed-a2a",
  "ragmed-core",
  "ragmed-llm",
  "uvicorn>=0.30",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/coordinator_agent"]
