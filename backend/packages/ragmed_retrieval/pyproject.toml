[project]
name = "ragmed-retrieval"
version = "0.1.0"
description = "Corpus ingestion, chunking and retrieval evaluation for RAGMed."
requires-python = ">=3.12"
dependencies = [
  "numpy>=2.1",
]

[project.optional-dependencies]
# Heavy model runtime, only needed to run the embedding benchmark.
bench = [
  "sentence-transformers>=3.3",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ragmed_retrieval"]
