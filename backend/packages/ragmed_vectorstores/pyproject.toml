[project]
name = "ragmed-vectorstores"
version = "0.1.0"
description = "One async interface over vector databases, with a shared contract test suite."
requires-python = ">=3.12"
dependencies = [
  "numpy>=2.1",
]

[project.optional-dependencies]
qdrant = [
  "qdrant-client>=1.12",
]

# Adapters are discovered through this entry point group, so a third-party package can add
# one with `pip install` and no fork:  load_store("my-db", ...).
[project.entry-points."ragmed.vectorstores"]
memory = "ragmed_vectorstores.memory:InMemoryStore"
qdrant = "ragmed_vectorstores.qdrant:QdrantStore"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ragmed_vectorstores"]
