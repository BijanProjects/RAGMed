[project]
name = "ragmed-retrieval"
version = "0.1.0"
description = "Corpus ingestion, chunking and retrieval evaluation for RAGMed."
requires-python = ">=3.12"
dependencies = [
  "numpy>=2.1",
]

[project.optional-dependencies]
# Heavy model runtime, only needed to run the embedding benchmark.
bench = [
  "sentence-transformers>=3.3",
  "onnx>=1.17",
]
# Light CPU runtime for the int8 ONNX export: no PyTorch needed.
onnx = [
  "onnxruntime>=1.20",
  "tokenizers>=0.20",
]
# In-memory BM25 for the hybrid benchmark (production uses Qdrant sparse vectors).
bm25 = [
  "bm25s>=0.2",
  "PyStemmer>=2.2",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ragmed_retrieval"]
