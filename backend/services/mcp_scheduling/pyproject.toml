[project]
name = "ragmed-mcp-scheduling"
version = "0.1.0"
description = "Scheduling MCP server: RAGMed Clinic's roster, appointment slots and bookings."
requires-python = ">=3.12"
dependencies = [
  "fastmcp>=4.2,<5",
  "httpx>=0.27",
  "ragmed-core",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_scheduling"]
